; =============================================================================
;  CatPrinter IPP Bridge - PlatformIO project configuration
;
;  Targets an ESP32-S3 (8MB+ flash). Arduino-ESP32 v3.x (ESP-IDF 5.x) is used
;  through the community maintained "pioarduino" platform because the
;  multi-instance mDNS API (one _ipp._tcp record per BLE printer) is only
;  available in ESP-IDF 5.x.
;
;  Environments:
;    esp32s3        - Any ESP32-S3 board, no PSRAM assumptions (safe default)
;    esp32s3-psram  - ESP32-S3 N16R8 / N8R8 style modules with octal PSRAM
;    native         - Host unit tests for the hardware independent libraries
;
;  Build:   pio run -e esp32s3
;  Flash:   pio run -e esp32s3 -t upload
;  Monitor: pio device monitor
;  Tests:   pio test -e native
; =============================================================================

[platformio]
default_envs = esp32s3

; -----------------------------------------------------------------------------
; Shared settings for all ESP32-S3 firmware builds
; -----------------------------------------------------------------------------
[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_ldf_mode = deep+
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.2
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.4.2
build_unflags =
    -std=gnu++11
    -std=gnu++17
build_flags =
    -std=gnu++2a
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    -DCORE_DEBUG_LEVEL=1
    ; ---- NimBLE: central role only, no peripheral/broadcaster needed -------
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2
    ; ---- AsyncTCP tuning ----------------------------------------------------
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    ; ---- Bridge defaults (override in platformio_override.ini) --------------
    -DCATBRIDGE_HOSTNAME=\"catbridge\"
    -DCATBRIDGE_VERSION=\"1.0.0\"

[env:esp32s3]
extends = esp32_common

[env:esp32s3-psram]
extends = esp32_common
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_HAS_PSRAM

; -----------------------------------------------------------------------------
; Host based unit tests (Unity). Only hardware independent libraries are
; compiled: IppProtocol, RasterPipeline and CatProtocol.
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_ldf_mode = chain
lib_compat_mode = strict
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
